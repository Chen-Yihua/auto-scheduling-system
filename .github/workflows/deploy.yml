name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLERK_ISSUER: ${{ secrets.CLERK_ISSUER }}
      CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pyright
      - run: pytest --cov=. --cov-report=term-missing

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          # setup-node 不吃 working-directory，lock 檔不在 repo 根目錄要明確指定
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # lint 與 typecheck 都依賴 .nuxt 產生的設定，要放在這步之後
      - run: npm run prepare:ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  # 跟 frontend-test 分開一個 job：這裡會真的 build 一次 Nuxt app、灌一次瀏覽器、
  # 開一個真的（headless）瀏覽器去操作頁面，比一般的 vitest 單元測試慢很多。
  # 登入後的情境需要一組真的 Clerk 測試帳密（E2E_CLERK_TEST_EMAIL/PASSWORD）；
  # fork 出去的 PR 拿不到 repo 的 secrets，這種情況下那個測試會自動 skip，
  # 不影響這個 job 本身通過。
  frontend-e2e-test:
    # 釘 24.04：ubuntu-latest 已換成 26.04，Playwright 1.52 不支援，裝不了瀏覽器
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      NUXT_PUBLIC_API_BASE_URL: ${{ secrets.NUXT_PUBLIC_API_BASE_URL }}
      NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NUXT_CLERK_SECRET_KEY: ${{ secrets.NUXT_CLERK_SECRET_KEY }}
      E2E_CLERK_TEST_EMAIL: ${{ secrets.E2E_CLERK_TEST_EMAIL }}
      E2E_CLERK_TEST_PASSWORD: ${{ secrets.E2E_CLERK_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          # setup-node 不吃 working-directory，lock 檔不在 repo 根目錄要明確指定
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run prepare:ci
      # 用 `npx playwright`（devDependency 裡釘死的版本，跟 playwright-core 對齊）
      # 而不是讓 npx 去抓 npm 上最新版的 playwright CLI——版本一旦對不上
      # playwright-core 實際在用的版本，抓下來的瀏覽器 revision 資料夾會跟
      # 執行時去找的路徑對不起來，導致 "Executable doesn't exist"。
      # chromium-headless-shell 也要明確裝，@nuxt/test-utils 在 headless
      # 模式下預設會找這個變體，不會因為裝了 chromium 就自動連它一起裝。
      - run: npx playwright install --with-deps chromium chromium-headless-shell
      - run: npm run test:e2e

  deploy-backend:
    needs: backend-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # id-token：向 GCP 用 Workload Identity Federation 換短期憑證，不在 repo 存 service account 金鑰
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: asia-east1-docker.pkg.dev/auto-scheduling-503916/autoscheduling/backend-server:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/290135928889/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: gh-deploy-auto-scheduling@auto-scheduling-503916.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      # 不用 Cloud Build：service account 沒有專案 Viewer 權限，gcloud builds submit 讀不到建置 log 會直接失敗
      - name: Build and push image
        run: |
          gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
      # 不帶 --set-env-vars：它會先清掉 Cloud Run 上所有環境變數，GitHub 沒有的 secret 會變成空值；
      # 後端的環境變數在 Cloud Run 上管理，不帶參數時部署會保留現有設定
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy auto-scheduling-backend \
            --image="$IMAGE" \
            --platform=managed \
            --region=asia-east1 \
            --allow-unauthenticated \
            --max-instances=3 \
            --quiet

  deploy-frontend:
    needs: [frontend-test, frontend-e2e-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # .vercel/ 不進版控，CI 沒有專案連結；直接指定，CLI 才不會去問要用哪個 team
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g vercel
      - run: vercel pull --yes --environment=production --token "${{ secrets.VERCEL_TOKEN }}"
      - run: vercel deploy --prod --archive=tgz --token "${{ secrets.VERCEL_TOKEN }}"
