name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'

  backend-test:
    needs: changes
    # 不用預設的 success()：changes 失敗時測試會被跳過，跳過又算通過，等於沒跑測試就能合併
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLERK_ISSUER: ${{ secrets.CLERK_ISSUER }}
      CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pyright
      - run: pytest --cov=. --cov-report=term-missing

  frontend-test:
    needs: changes
    # 不用預設的 success()：changes 失敗時測試會被跳過，跳過又算通過，等於沒跑測試就能合併
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          # setup-node 不吃 working-directory，lock 檔不在 repo 根目錄要明確指定
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # lint 與 typecheck 都依賴 .nuxt 產生的設定，要放在這步之後
      - run: npm run prepare:ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  # 跟 frontend-test 分開一個 job：這裡會真的 build 一次 Nuxt app、灌一次瀏覽器、
  # 開一個真的（headless）瀏覽器去操作頁面，比一般的 vitest 單元測試慢很多。
  # 前端與後端由 Playwright 在 job 裡啟動（playwright.config.ts），MongoDB 用下面的 docker run 步驟啟動；
  # 不連 Cloud Run。後端也會影響這個 job，所以前端或後端有改動時都執行。
  # 沒有 Clerk 金鑰時（fork 出去的 PR 拿不到 repo 的 secrets）整個 E2E 只執行一個標示跳過的測試，job 照樣通過；
  # 有金鑰但沒有 E2E_CLERK_TEST_EMAIL 時，登入與登入後的測試跳過，訪客測試照常執行。
  # 這個 job 不上傳 trace、截圖、影片與報告：repo 與 CI log 都是公開的。
  frontend-e2e-test:
    needs: changes
    # 不用預設的 success()：changes 失敗時測試會被跳過，跳過又算通過，等於沒跑測試就能合併
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    # 不設上限時卡住要等 GitHub 預設的 6 小時才會停；正常整個 job 約 10 分鐘
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NUXT_CLERK_SECRET_KEY: ${{ secrets.NUXT_CLERK_SECRET_KEY }}
      E2E_CLERK_TEST_EMAIL: ${{ secrets.E2E_CLERK_TEST_EMAIL }}
      E2E_CLERK_TEST_PASSWORD: ${{ secrets.E2E_CLERK_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          # setup-node 不吃 working-directory，lock 檔不在 repo 根目錄要明確指定
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: npm ci
      - run: npm run prepare:ci
      # 用 `npx playwright`（devDependency 裡的版本）而不是讓 npx 去抓 npm 上最新版的 playwright CLI，
      # 版本對不上時，抓下來的瀏覽器 revision 資料夾會跟執行時去找的路徑對不起來，導致 "Executable doesn't exist"。
      # 正常 6～9 分鐘；卡住時不會自己失敗，曾卡過 2 小時以上
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 20
      # 不用 services：job 結束時 GitHub 會把 service container 的 log 印進公開的 CI log，
      # 加 --log-driver none 又會印出讀不到 log 的錯誤。27018 跟 e2eEnv.ts 的 mongoPort 一致
      - name: 啟動 MongoDB
        run: |
          docker run -d --name e2e-mongo --log-driver none -p 27018:27017 mongo:7 > /dev/null
          timeout 60 bash -c 'until docker exec e2e-mongo mongosh --quiet --eval "db.runCommand({ping:1})" > /dev/null 2>&1; do sleep 1; done'
      - run: npm run test:e2e

  deploy-backend:
    needs: [changes, backend-test]
    # 開啟後端部署時：刪掉 if: false，取消下面這行的註解
    # if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.backend == 'true'
    if: false
    runs-on: ubuntu-latest
    # id-token：向 GCP 用 Workload Identity Federation 換短期憑證，不在 repo 存 service account 金鑰
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: asia-east1-docker.pkg.dev/auto-scheduling-503916/autoscheduling/backend-server:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/290135928889/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: gh-deploy-auto-scheduling@auto-scheduling-503916.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      # 不用 Cloud Build：service account 沒有專案 Viewer 權限，gcloud builds submit 讀不到建置 log 會直接失敗
      - name: Build and push image
        run: |
          gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
      # 不帶 --set-env-vars：它會先清掉 Cloud Run 上所有環境變數，GitHub 沒有的 secret 會變成空值；
      # 後端的環境變數在 Cloud Run 上管理，不帶參數時部署會保留現有設定
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy auto-scheduling-backend \
            --image="$IMAGE" \
            --platform=managed \
            --region=asia-east1 \
            --max-instances=3 \
            --quiet

  deploy-frontend:
    needs: [changes, frontend-test, frontend-e2e-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # .vercel/ 不進版控，CI 沒有專案連結；直接指定，CLI 才不會去問要用哪個 team
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g vercel
      - run: vercel pull --yes --environment=production --token "${{ secrets.VERCEL_TOKEN }}"
      - run: vercel deploy --prod --archive=tgz --token "${{ secrets.VERCEL_TOKEN }}"
