name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest --cov=. --cov-report=term-missing

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run prepare:ci
      - run: npm run test

  deploy-backend:
    needs: backend-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_JSON }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        working-directory: Backend
        run: |
          gcloud builds submit --tag "asia-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/autoscheduling/backend-server:${{ github.sha }}" .
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy auto-scheduling-backend \
            --image="asia-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/autoscheduling/backend-server:${{ github.sha }}" \
            --platform=managed \
            --region=asia-east1 \
            --allow-unauthenticated \
            --quiet \
            --set-env-vars="CLERK_ISSUER=${{ secrets.CLERK_ISSUER }},CLERK_JWKS_URL=${{ secrets.CLERK_JWKS_URL }},CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }},MONGO_URI=${{ secrets.MONGO_URI }},GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }},GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }},SECRET_ENCRYPTION_KEY=${{ secrets.SECRET_ENCRYPTION_KEY }},CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }},DISCORD_MR_WEBHOOK_URL=${{ secrets.DISCORD_MR_WEBHOOK_URL }},DISCORD_MAIN_WEBHOOK_URL=${{ secrets.DISCORD_MAIN_WEBHOOK_URL }}"

  deploy-frontend:
    needs: frontend-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g vercel
      - run: vercel pull --yes --environment=production --token "${{ secrets.VERCEL_TOKEN }}"
      - run: vercel deploy --prod --archive=tgz --token "${{ secrets.VERCEL_TOKEN }}"
